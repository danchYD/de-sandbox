services:
  minio:
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    networks:
      - sbox-net
    ports:
      - "${MINIO_API_PORT:?Set MINIO_API_PORT in .env}:9000"
      - "${MINIO_CONSOLE_PORT:?Set MINIO_CONSOLE_PORT in .env}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - sbox-net
    ports:
      - "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    

volumes:
  minio-data:
  minio-config:
  postgres:

networks:
  sbox-net:
